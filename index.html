  <style>

    *{box-sizing:border-box} body{margin:0;background:#e8eef8;color:var(--ink);font:14px "Microsoft YaHei","PingFang SC",Arial,sans-serif}

    .profile{overflow:hidden;border-radius:21px;background:linear-gradient(135deg,#2563eb,#60a5fa);padding:22px;color:white}.profile .avatar{display:inline-grid;background:#e2e8f0;font-size:28px}.profile h2{margin:7px 0 4px}.profile p{margin:0;opacity:.9}.credit{color:#dcfce7!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:13px 0;background:white;border-radius:15px}.stats button{padding:15px 4px;background:white}.stats b,.stats small{display:block}.stats b{font-size:20px}.stats small{margin-top:4px;color:var(--muted);font-size:11px}.menu{border-radius:15px;overflow:hidden;background:white}.menu-row{display:flex;width:100%;align-items:center;text-align:left}.menu-row span{font-size:19px;margin-right:12px}.menu-row b{flex:1}.menu-row em{font-style:normal;color:#94a3b8}

    .modal{position:fixed;z-index:9;inset:0;display:grid;place-items:end center;background:#0f172a55}.sheet{width:min(100%,540px);max-height:90vh;overflow:auto;padding:20px 18px 28px;border-radius:23px 23px 0 0;background:white}.sheet h2{margin:0 0 17px}.close{float:right;width:31px;height:31px;border-radius:50%;background:#f1f5f9;font-size:20px}.field{display:block;margin:13px 0;font-weight:600}.field input,.field textarea,.field select{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid #dbe3ee;border-radius:10px;outline:none}.field textarea{min-height:95px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue)}.error{min-height:16px;margin-top:4px;color:#ef4444;font-size:11px;font-weight:400}.primary{width:100%;padding:13px;border-radius:12px;background:var(--blue);color:white;font-weight:700}.primary:disabled{background:#cbd5e1}
    .detail{position:fixed;z-index:8;inset:0;overflow:auto;background:var(--bg);padding:18px 16px 96px}.back{padding:8px;background:transparent;font-size:18px}.detail-card{margin-top:8px;padding:18px;border-radius:17px;background:white}.detail-card h2{margin:12px 0}.detail-card p{line-height:1.7;color:#475569}.detail-card hr{border:0;border-top:1px solid var(--line);margin:18px 0}.detail-bar{position:fixed;bottom:0;left:50%;width:min(100%,540px);padding:12px 16px;background:white;transform:translateX(-50%);border-top:1px solid var(--line)}
    .chat{position:fixed;z-index:8;inset:0;background:#f6f8fc;padding:14px 15px 76px}.chat-head{display:flex;gap:12px;align-items:center;padding-bottom:12px}.chat-body{display:grid;gap:10px}.bubble{max-width:76%;padding:9px 11px;border-radius:12px;background:#e2e8f0;line-height:1.5}.bubble.me{justify-self:end;background:var(--blue);color:white}.bubble small{display:block;margin-top:4px;font-size:10px;opacity:.7}.chat-form{position:fixed;bottom:0;left:50%;display:flex;gap:8px;width:min(100%,540px);padding:11px;background:white;transform:translateX(-50%)}.chat-form input{flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 13px}.chat-form button{padding:0 14px;border-radius:20px;background:var(--blue);color:white}
    .toast{position:fixed;z-index:20;top:18px;left:50%;max-width:85%;padding:10px 15px;border-radius:99px;background:#17243aeF;color:white;transform:translate(-50%,-80px);transition:.25s}.toast.show{transform:translate(-50%,0)}
    @media(min-width:541px){body{padding:0}.fab{right:calc((100% - 540px)/2 + 18px)}}
  </style>

  <div class="modal" id="publishModal" hidden><form class="sheet" id="publishForm"><button type="button" class="close" data-close="publishModal">×</button><h2>发布需求</h2><label class="field">任务分类<select name="category" required><option value="">请选择任务分类</option><option>代取快递</option><option>跑腿代办</option><option>二手交易</option><option>失物招领</option><option>组队拼单</option><option>其他</option></select><div class="error"></div></label><label class="field">任务标题<input name="title" maxlength="50" placeholder="请输入任务标题，一句话说清楚" required><div class="error"></div></label><label class="field">任务描述<textarea name="description" maxlength="300" placeholder="详细描述任务要求、地点、时间等" required></textarea><div class="error"></div></label><label class="field">赏金金额<input name="reward" inputmode="decimal" placeholder="¥ 输入赏金金额" required><div class="error"></div></label><label class="field">截止时间（选填）<input name="deadline" type="datetime-local"></label><label class="field">联系方式（选填）<input name="contact" maxlength="50" placeholder="微信号/手机号"></label><button class="primary" type="submit">发布任务</button></form></div>

  <div class="toast" id="toast"></div>
  <script>
    (function(){
      var K={tasks:'hangxiaobang_tasks_v2',profile:'hangxiaobang_profile_v2',posts:'hangxiaobang_posts_v2',chats:'hangxiaobang_chats_v2'};
      var categories=['全部','代取快递','跑腿代办','二手交易','失物招领','组队拼单'];
      var icons={'代取快递':'📦','跑腿代办':'🏃','二手交易':'🔄','失物招领':'🔍','组队拼单':'👥','其他':'✨'};
      var filter='全部',currentChat='',timer;
      function el(id){return document.getElementById(id)} function read(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}} function write(k,v){localStorage.setItem(k,JSON.stringify(v))} function id(p){return p+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)} function ago(m){return new Date(Date.now()-m*60000).toISOString()}
      function seed(){return [
        ['帮忙代取南区驿站快递','代取快递','南区驿站取件，送到蓝天公寓 211，取件码私聊。',3,'open',12,'校园同学'],
        ['代取顺丰快递到北门','代取快递','北门顺丰柜取件后送到教学楼，包裹不大。',4,'progress',65,'小明同学'],
        ['帮买一杯咖啡送图书馆','跑腿代办','图书馆一楼咖啡店，冰美式一杯，费用另算。',5,'open',25,'校园同学'],
        ['帮忙打印课程作业','跑腿代办','A4 双面黑白 20 页，今晚九点前送到宿舍楼下。',3,'done',150,'校园同学'],
        ['出二手高等数学教材','二手交易','同济版高数上下册，少量笔记，保存完好可面交。',18,'open',40,'校园同学'],
        ['寻找遗失的校园卡','失物招领','昨晚可能遗失在一食堂附近，拾到请联系我，十分感谢。',20,'progress',90,'失物招领志愿者'],
        ['周末羽毛球组队','组队拼单','体育馆双打，还差两位同学，新手也欢迎。',1,'open',18,'校园同学'],
        ['求购闲置台灯','其他','想收一个宿舍用的护眼台灯，成色好即可。',15,'done',360,'校园同学']
      ].map(function(x,n){return {id:'seed-'+n,title:x[0],category:x[1],description:x[2],reward:x[3],status:x[4],created_at:ago(x[5]),publisher:x[6],assignee:(x[4]!=='open'?(n===1||n===5?'热心同学':'校园同学'):''),contact:'未公开',deadline:''}})}
      function tasks(){var t=read(K.tasks,null);if(!Array.isArray(t)){t=seed();write(K.tasks,t)}return t} function saveTasks(t){write(K.tasks,t)}
      function profile(){return read(K.profile,{name:'校园同学'})} function saveProfile(p){write(K.profile,p)}
      function status(t){return t.status==='open'?['待接单','open']:t.status==='progress'?['进行中','progress']:['已完成','done']} function relative(time){var m=Math.max(1,Math.floor((Date.now()-new Date(time).getTime())/60000));return m<60?m+'分钟前':m<1440?Math.floor(m/60)+'小时前':Math.floor(m/1440)+'天前'} function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
      function toast(s){el('toast').textContent=s;el('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(function(){el('toast').classList.remove('show')},1900)}
      function renderChips(){el('chips').innerHTML=categories.map(function(c){var n=c==='全部'?tasks().length:tasks().filter(function(t){return t.category===c}).length;return '<button data-c="'+c+'" class="'+(filter===c?'active':'')+'">'+c+' <b>'+n+'</b></button>'}).join('');[].forEach.call(el('chips').querySelectorAll('button'),function(b){b.onclick=function(){filter=b.dataset.c;renderTasks()}})}
      function renderTasks(list){var t=(list||tasks()).slice().sort(function(a,b){var p={open:0,progress:1,done:2};return p[a.status]-p[b.status]||new Date(b.created_at)-new Date(a.created_at)});if(filter!=='全部'&&!list)t=t.filter(function(x){return x.category===filter});renderChips();el('taskList').innerHTML=t.length?t.map(function(x){var s=status(x);return '<article class="task" data-id="'+x.id+'"><div class="icon">'+(icons[x.category]||'✨')+'</div><main><h3>'+esc(x.title)+'</h3><p>'+esc(x.description)+'</p><footer><b class="reward">¥'+Number(x.reward).toFixed(2)+'</b><time>'+relative(x.created_at)+'</time><span class="status '+s[1]+'">'+s[0]+'</span></footer></main></article>'}).join(''):'<div class="empty"><span>🛸</span><strong>暂无此类任务</strong>去发布第一个吧！</div>';[].forEach.call(el('taskList').querySelectorAll('.task'),function(card){card.onclick=function(){openDetail(card.dataset.id)}});updateProfile()}
      function openDetail(taskId){var t=tasks().filter(function(x){return x.id===taskId})[0];if(!t)return;var s=status(t);el('detail').innerHTML='<button class="back" id="detailBack">← 返回</button><div class="detail-card"><span class="status '+s[1]+'">'+s[0]+'</span><h2>'+esc(t.title)+'</h2><b class="reward">¥'+Number(t.reward).toFixed(2)+'</b><p>发布于 '+new Date(t.created_at).toLocaleString('zh-CN',{hour12:false})+'</p><hr><p><b>发布者：</b>'+esc(t.publisher)+'　信用分 100</p><h3>任务详情</h3><p>'+esc(t.description)+'</p><p><b>联系方式：</b>'+esc(t.contact||'未公开')+'</p></div><div class="detail-bar" id="detailAction"></div>';el('detail').hidden=false;el('detailBack').onclick=function(){el('detail').hidden=true;renderTasks()};var action=el('detailAction');if(t.status==='open'){action.innerHTML='<button class="primary">我要接单</button>';action.firstChild.onclick=function(){if(confirm('确认接单吗？接单后请按时完成任务。')){t.status='progress';t.assignee=profile().name;saveTasks(tasks());toast('已成功接单');openDetail(t.id)}}}else if(t.status==='progress'&&t.assignee===profile().name){action.innerHTML='<button class="primary" style="background:#f97316">确认完成</button>';action.firstChild.onclick=function(){if(confirm('确认任务已完成？')){t.status='done';saveTasks(tasks());toast('任务已完成');openDetail(t.id)}}}else{action.innerHTML='<button class="primary" disabled>'+ (t.status==='done'?'任务已结束':'已被接单')+'</button>'}}
      function openPublish(){el('publishModal').hidden=false} function close(id){el(id).hidden=true} function valid(form){var ok=true;var a=form.category,b=form.title,c=form.description,d=form.reward;function err(node,msg){node.parentNode.querySelector('.error').textContent=msg;if(msg)ok=false}err(a,!a.value?'请选择任务分类':'');err(b,!b.value.trim()?'请输入任务标题':b.value.trim().length<5?'标题至少 5 个字符':'');err(c,!c.value.trim()?'请输入任务描述':c.value.trim().length<10?'描述至少 10 个字符':'');err(d,!d.value?'请输入赏金金额':(!/^\\d+(\\.\\d{1,2})?$/.test(d.value)||Number(d.value)<0.1||Number(d.value)>200)?'赏金需在 0.1 到 200 元之间':'');return ok}
      function posts(){var p=read(K.posts,null);if(Array.isArray(p))return p;p=[{id:'p1',title:'期末选课大家有什么推荐吗？',content:'想选一门作业不太多的通识课，欢迎推荐老师和课程。',author:'小航同学',time:'今天',likes:34},{id:'p2',title:'一食堂新开的麻辣烫怎么样',content:'今天路过看到排队很长，有同学吃过吗？',author:'匿名同学',time:'昨天',likes:21},{id:'p3',title:'二手书交易避坑小技巧',content:'面交时建议重点检查缺页、笔记和印刷质量。',author:'书架管理员',time:'昨天',likes:42}];write(K.posts,p);return p} function renderPosts(){el('postList').innerHTML=posts().map(function(p){return '<article class="post"><h3>'+esc(p.title)+'</h3><p>'+esc(p.content)+'</p><footer>'+esc(p.author)+' · '+p.time+'　💬 0　♥ '+p.likes+'</footer></article>'}).join('')+'<button class="primary" id="addPost">发布帖子</button>';el('addPost').onclick=function(){var title=prompt('帖子标题');var content=prompt('帖子内容');if(title&&content){var p=posts();p.unshift({id:id('post'),title:title,content:content,author:profile().name,time:'刚刚',likes:0});write(K.posts,p);renderPosts();toast('帖子发布成功')}}}
      function chats(){var c=read(K.chats,null);if(Array.isArray(c))return c;c=[{id:'system',name:'系统通知',unread:1,items:[['other','欢迎使用航小帮，校园互助从这里开始。','昨天'],['other','社区公约提醒：请文明沟通，保护个人隐私。','10:20']]},{id:'xiaoming',name:'小明同学',unread:2,items:[['other','你好，看到你发布了代取快递的任务。','09:10'],['me','你好，请问你现在方便去驿站吗？','09:15'],['other','可以的，我正好在南门附近。','09:18']]},{id:'lisi',name:'李四学长',unread:0,items:[['other','这本高数教材还在吗？','昨天'],['me','还在的，书上没有笔记。','昨天']]}];write(K.chats,c);return c} function renderChats(){var c=chats().slice().sort(function(a,b){return a.id==='system'?-1:b.id==='system'?1:0});el('conversationList').innerHTML=c.map(function(x){var last=x.items[x.items.length-1];return '<article class="conversation" data-id="'+x.id+'"><div class="avatar">'+(x.id==='system'?'🔔':'👤')+'</div><main><b>'+esc(x.name)+'</b><p>'+esc(last[1])+'</p></main><aside><time>'+last[2]+'</time>'+ (x.unread?'<span class="badge">'+x.unread+'</span>':'')+'</aside></article>'}).join('');[].forEach.call(el('conversationList').querySelectorAll('.conversation'),function(n){n.onclick=function(){openChat(n.dataset.id)}})}
      function openChat(chatId){currentChat=chatId;var c=chats().filter(function(x){return x.id===chatId})[0];c.unread=0;write(K.chats,chats());el('chat').innerHTML='<div class="chat-head"><button class="back" id="chatBack">←</button><b>'+esc(c.name)+'</b></div><div class="chat-body" id="bubbleList"></div>'+(chatId==='system'?'':'<form class="chat-form" id="chatForm"><input maxlength="300" placeholder="输入消息..."><button>发送</button></form>');el('chat').hidden=false;function draw(){el('bubbleList').innerHTML=c.items.map(function(m){return '<div class="bubble '+(m[0]==='me'?'me':'')+'">'+esc(m[1])+'<small>'+m[2]+'</small></div>'}).join('')}draw();el('chatBack').onclick=function(){el('chat').hidden=true;renderChats()};var f=el('chatForm');if(f)f.onsubmit=function(e){e.preventDefault();var input=f.querySelector('input'),v=input.value.trim();if(v){c.items.push(['me',v,new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})]);write(K.chats,chats());input.value='';draw()}}}
      function show(page){['home','forum','messages','mine'].forEach(function(x){el(x).hidden=x!==page});el('publish').hidden=page!=='home';[].forEach.call(document.querySelectorAll('.nav button'),function(b){b.classList.toggle('active',b.dataset.page===page)});if(page==='forum')renderPosts();if(page==='messages')renderChats();if(page==='mine')updateProfile();window.scrollTo(0,0)}
      function updateProfile(){var t=tasks(),p=profile();el('profileName').textContent=p.name;el('publishedCount').textContent=t.filter(function(x){return x.publisher===p.name}).length;el('acceptedCount').textContent=t.filter(function(x){return x.assignee===p.name}).length;el('completedCount').textContent=t.filter(function(x){return x.assignee===p.name&&x.status==='done'}).length}
      el('publish').onclick=openPublish;el('refresh').onclick=function(){renderTasks();toast('已获取最新任务')};el('notice').onclick=function(){toast('系统通知：欢迎使用航小帮')};[].forEach.call(document.querySelectorAll('[data-tip]'),function(b){b.onclick=function(){toast(b.dataset.tip+'功能开发中')}});[].forEach.call(document.querySelectorAll('[data-close]'),function(b){b.onclick=function(){close(b.dataset.close)}});el('publishForm').onsubmit=function(e){e.preventDefault();var f=e.target;if(!valid(f))return;var t=tasks();t.unshift({id:id('task'),title:f.title.value.trim(),category:f.category.value,description:f.description.value.trim(),reward:Number(f.reward.value),status:'open',created_at:new Date().toISOString(),publisher:profile().name,assignee:'',contact:f.contact.value.trim()||'未公开',deadline:f.deadline.value});saveTasks(t);f.reset();close('publishModal');filter='全部';renderTasks();toast('🎉 任务发布成功！')};[].forEach.call(document.querySelectorAll('.nav button'),function(b){b.onclick=function(){if(b.dataset.page==='publish')openPublish();else show(b.dataset.page)}});el('editName').onclick=function(){var n=prompt('修改昵称（最多16个字符）',profile().name);if(n&&n.trim()){var p=profile();p.name=n.trim().slice(0,16);saveProfile(p);updateProfile();renderTasks();toast('昵称已保存')}};el('myPublish').onclick=function(){show('home');filter='全部';renderTasks(tasks().filter(function(t){return t.publisher===profile().name}));toast('正在显示我的发布')};el('myAccept').onclick=function(){show('home');filter='全部';renderTasks(tasks().filter(function(t){return t.assignee===profile().name}));toast('正在显示我的接单')};el('clearData').onclick=function(){if(confirm('确定清除本机的任务、帖子和消息吗？')){Object.keys(K).forEach(function(k){localStorage.removeItem(K[k])});renderTasks();updateProfile();toast('演示数据已重置')}};el('courseTab').onclick=function(){toast('选课评价功能将在论坛持续更新')};el('guideTab').onclick=function(){toast('新生攻略功能将在论坛持续更新')};renderTasks();
    })();
